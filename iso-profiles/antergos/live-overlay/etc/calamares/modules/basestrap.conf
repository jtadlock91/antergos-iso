---
backend: pacman

pacman:
    num_retries: 0
    disable_download_timeout: false
    needed_only: false
    handle_keyrings: true
    copy_pacconf: true
    requirements:
      - dest: /etc
        mode: "0o755"
      - dest: /var
        mode: "0o755"
      - dest: /var/cache
        mode: "0o755"
      - dest: /var/cache/pacman
        mode: "0o755"
      - dest: /var/cache/pacman/pkg
        mode: "0o755"
      - dest: /var/lib
        mode: "0o755"
      - dest: /var/lib/pacman
        mode: "0o755"
    keyrings:
      - artix
      - antergos-next

base_init: elogind

operations:
  - install:
    - base
    - antergos-next-keyring
    - antergos-release
    # Without this, GPU/wifi/etc. drivers can fail to initialize at all
    # on first boot. Added here (not profile.yaml, which only affects
    # the live ISO session, never the installed target) because
    # basestrap is the step in Calamares' actual install sequence
    # that's guaranteed to run regardless of desktop choice — verified
    # against the full 32-step sequence in docs/installer.md.
    - linux-firmware
    # users.conf sets every new user's default shell to zsh regardless
    # of desktop choice, but zsh was never guaranteed to be installed —
    # a real login lockout (pam_shells.so rejects the shell before the
    # password is even checked). Same reasoning as linux-firmware above.
    - zsh
    # Post-install checks/fixes. Self-hosted via [jtadlock-pkgs] (see
    # pacman.conf) since this fork doesn't have write access to
    # antergos-pkgs.
    - distro-tool

