#
# /etc/pacman.conf
#
# See the pacman.conf(5) manpage for option and repository directives

#
# GENERAL OPTIONS
#
[options]
HoldPkg     = pacman glibc
IgnorePkg   = xorg-server xorg-server-common xorg-server-libs
Architecture = auto
CheckSpace
ParallelDownloads = 5
DownloadUser = alpm

# Strip docs/man/info to save space in the ISO
NoExtract = usr/share/doc/* usr/share/man/* usr/share/info/*

# Strip non-English UI translations to save space in the ISO (KDE +
# Qt locale files: ~608MB on a full install, the single largest
# stripping opportunity found — bigger than every package removed).
# English UI strings are compiled directly into apps, not sourced from
# these files, so this never breaks anything — apps missing a
# translation just fall back to English automatically. This is
# forward-looking only (skips future extraction), not retroactive, and
# reversible — see docs/restoring-languages.md for how.
NoExtract = usr/share/locale/* !usr/share/locale/en* !usr/share/locale/locale.alias
NoExtract = usr/share/qt6/translations/* !usr/share/qt6/translations/*en*

SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

# Antergos NeXT custom packages repo
[antergos-pkgs]
# SigLevel intentionally weakened to Never, not just Optional TrustAll —
# confirmed via a real "key is unknown, could not be looked up
# remotely" failure on multiple keyservers. Real precedent (Arch forum
# thread, identical symptom on another small custom repo) points to
# the actual cause: this key was likely never published to any public
# keyserver at all, meaning no --recv-keys attempt can ever succeed
# regardless of which server is tried. TrustAll alone didn't prevent
# the prompt in practice; Never does, by skipping verification
# entirely for this repo. Real tradeoff: zero cryptographic
# verification for antergos-pkgs packages, relying on HTTPS transport
# security and GitHub's own hosting integrity instead.
SigLevel = Never
Server = https://antergos-next.github.io/antergos-packages/

# distro-tool, Vivaldi — post-install checks/fixes and packages not
# available anywhere else, self-hosted since this fork doesn't have
# write access to antergos-pkgs. Hosted via GitHub Release assets, not
# GitHub Pages — Pages enforces a 100MB per-file limit that Vivaldi's
# real package (~154MB) exceeds; Release assets support up to 2GB.
[jtadlock-pkgs]
SigLevel = Optional TrustAll
Server = https://github.com/jtadlock91/distro-tool-repo/releases/download/packages/

[system]
Include = /etc/pacman.d/mirrorlist

[world]
Include = /etc/pacman.d/mirrorlist

[galaxy]
Include = /etc/pacman.d/mirrorlist

# 32-bit support (Steam and other games need this) — added directly
# here rather than requiring a post-install step, since basestrap's
# copy_pacconf setting copies whatever pacman.conf the live session
# uses straight onto the install target, same proven mechanism already
# making antergos-pkgs/jtadlock-pkgs work on every fresh install.
[lib32]
Include = /etc/pacman.d/mirrorlist
