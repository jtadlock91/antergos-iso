#
# /etc/pacman.conf
#
# See the pacman.conf(5) manpage for option and repository directives

#
# GENERAL OPTIONS
#
[options]
HoldPkg     = pacman glibc
IgnorePkg   = xorg-server xorg-server-common xorg-server-libs
Architecture = auto
CheckSpace
ParallelDownloads = 5
DownloadUser = alpm

# Strip docs/man/info to save space in the ISO
NoExtract = usr/share/doc/* usr/share/man/* usr/share/info/*

SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

# Antergos NeXT custom packages repo
[antergos-pkgs]
SigLevel = Optional TrustAll
Server = https://antergos-next.github.io/antergos-packages/

# distro-tool — post-install checks/fixes, self-hosted since this fork
# doesn't have write access to antergos-pkgs. Same simple flat-repo
# pattern as antergos-pkgs above.
[jtadlock-pkgs]
SigLevel = Optional TrustAll
Server = https://jtadlock91.github.io/distro-tool-repo/

[system]
Include = /etc/pacman.d/mirrorlist

[world]
Include = /etc/pacman.d/mirrorlist

[galaxy]
Include = /etc/pacman.d/mirrorlist
